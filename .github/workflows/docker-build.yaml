name: Build, Push and Update GitOps (EKS)

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: onebite-cicd-frontend-gitops
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      prod_tag: ${{ steps.meta.outputs.prod_tag }}
      dev_back_tag: ${{ steps.meta.outputs.dev_back_tag }}
      dev_front_tag: ${{ steps.meta.outputs.dev_front_tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select immutable tag and GitOps values file
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "prod_tag=sha-${GITHUB_SHA}-prod" >> "${GITHUB_OUTPUT}"
            echo "dev_back_tag=" >> "${GITHUB_OUTPUT}"
            echo "dev_front_tag=" >> "${GITHUB_OUTPUT}"
          else
            echo "prod_tag=" >> "${GITHUB_OUTPUT}"
            echo "dev_back_tag=sha-${GITHUB_SHA}-dev-back" >> "${GITHUB_OUTPUT}"
            echo "dev_front_tag=sha-${GITHUB_SHA}-dev-front" >> "${GITHUB_OUTPUT}"
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: heung115
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image (prod)
        if: ${{ github.ref_name == 'main' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            heung115/spaghetti-fe:${{ steps.meta.outputs.prod_tag }}
            heung115/spaghetti-fe:latest
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID_PROD }}
            NEXT_PUBLIC_FRONTEND_URL=${{ secrets.NEXT_PUBLIC_FRONTEND_URL_PROD }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_PROD }}

      - name: Build and push frontend image (dev-back)
        if: ${{ github.ref_name == 'develop' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            heung115/spaghetti-fe:${{ steps.meta.outputs.dev_back_tag }}
            heung115/spaghetti-fe:latest-back
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_FRONTEND_URL=${{ secrets.NEXT_PUBLIC_FRONTEND_URL_BACK }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_BACK }}

      - name: Build and push frontend image (dev-front)
        if: ${{ github.ref_name == 'develop' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            heung115/spaghetti-fe:${{ steps.meta.outputs.dev_front_tag }}
            heung115/spaghetti-fe:dev
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_FRONTEND_URL=${{ secrets.NEXT_PUBLIC_FRONTEND_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI/CD EKS GitOps path
        uses: actions/checkout@v4
        with:
          repository: heung115/tmp-onebite-gitops
          ref: eks
          path: gitops
          ssh-key: ${{ secrets.GITOPS_WRITE_KEY }}

      - name: Update frontend image tag in GitOps
        env:
          PROD_TAG: ${{ needs.build-and-push.outputs.prod_tag }}
          DEV_BACK_TAG: ${{ needs.build-and-push.outputs.dev_back_tag }}
          DEV_FRONT_TAG: ${{ needs.build-and-push.outputs.dev_front_tag }}
        shell: bash
        run: |
          set -euo pipefail
          update_image() {
            local values_file="$1"
            local image_tag="$2"
            local file="gitops/${values_file}"
            test -f "${file}"
            sed -i -E "s|^  image: .*|  image: \"heung115/spaghetti-fe:${image_tag}\"|" "${file}"
            grep -Fx "  image: \"heung115/spaghetti-fe:${image_tag}\"" "${file}"
            git -C gitops add "${values_file}"
          }
          if [[ -n "${PROD_TAG}" ]]; then
            update_image "eks/cicd/values/frontend-prod.yaml" "${PROD_TAG}"
          fi
          if [[ -n "${DEV_BACK_TAG}" ]]; then
            update_image "eks/cicd/values/frontend-dev-back.yaml" "${DEV_BACK_TAG}"
          fi
          if [[ -n "${DEV_FRONT_TAG}" ]]; then
            update_image "eks/cicd/values/frontend-dev-front.yaml" "${DEV_FRONT_TAG}"
          fi
          git -C gitops diff --check
          git -C gitops config user.name "github-actions[bot]"
          git -C gitops config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git -C gitops diff --cached --quiet; then
            echo "GitOps already points to this frontend commit; no commit needed."
            exit 0
          fi
          git -C gitops commit -m "deploy(cicd): spaghetti-fe ${GITHUB_SHA} [skip ci]"
          for attempt in 1 2 3 4 5; do
            if ! git -C gitops fetch origin eks; then
              sleep "${attempt}"
              continue
            fi
            if ! git -C gitops rebase origin/eks; then
              git -C gitops rebase --abort || true
              sleep "${attempt}"
              continue
            fi
            if git -C gitops push origin HEAD:eks; then
              exit 0
            fi
            sleep "${attempt}"
          done
          echo "Unable to push the GitOps update after five attempts." >&2
          exit 1
